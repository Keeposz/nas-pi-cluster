name: Renovate

on:
  schedule:
    # every morning at 08:00 brussels time, summer and winter time handled by github
    - cron: "0 8 * * *"
      timezone: "Europe/Brussels"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: read
    steps:
      - name: Record start time
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-image: renovate/renovate:44.239.1@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "Keeposz <205087396+Keeposz@users.noreply.github.com>"
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPORT_PATH: /tmp/renovate-report.json
          RENOVATE_LOG_FILE: /tmp/renovate-log.ndjson
          RENOVATE_LOG_FILE_LEVEL: debug

      - name: Write summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: /tmp/renovate-report.json
          LOG: /tmp/renovate-log.ndjson
        run: |
          # renovate restarts after an automerge and its report only covers the last pass,
          # so merges come from github and everything still open comes from the report
          merged=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 30 \
            --json number,title,url,mergedAt,headRefName \
            --jq "[.[] | select((.headRefName | startswith(\"renovate/\")) and .mergedAt >= \"$STARTED_AT\")]" \
            || echo '[]')

          if [[ -s "$REPORT" ]]; then
            has_report=yes
            data=$(jq -c --arg repo "$GITHUB_REPOSITORY" '.repositories[$repo] // {}' "$REPORT")
          else
            has_report=no
            data='{}'
          fi

          # renovate can stop a run early (e.g. repository-changed), its report is then incomplete
          result=$(jq -r 'select(.msg == "Repository finished") | .result // empty' "$LOG" 2>/dev/null | tail -n 1 || true)
          echo "RUN_RESULT=$result" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/summary.jq" <<'JQ'
          def short: sub("^sha256:"; "") | .[0:7];
          def old_version: if .updateType == "digest" then (.currentDigest // "" | short) else (.currentVersion // .currentValue // "") end;
          def new_version: if .updateType == "digest" or .updateType == "pinDigest" then (.newDigest // "" | short) else (.newVersion // .newValue // "") end;
          def pr: if .prNo then " [#\(.prNo)](https://github.com/\($repo)/pull/\(.prNo))" else "" end;
          def status:
            if   .result == "pr-created" then "🆕 PR opened"
            elif .result == "already-existed" then "🚫 Closed earlier, ignored"
            elif .result == "pending" then "⏳ Waiting for release age or checks"
            elif .result == "needs-approval" or .result == "needs-pr-approval" then "🖐️ Needs approval in dashboard"
            elif .result == "not-scheduled" or .result == "update-not-scheduled" then "🗓️ Outside schedule"
            elif .result == "error" then "❌ Error, see log"
            elif .result == null then "⏭️ Next run"
            elif (.result | endswith("limit-reached")) then "⏸️ Limit reached, next run"
            elif .prNo then "🔀 PR open"
            else .result end;

          ($data.branches // []) as $branches
          | [$branches[] | select(.result != "automerged")] as $open
          | ([$open[] | select(.prNo)] | length) as $prs
          | ([$open[] | select(.prNo | not)] | length) as $waiting
          | (if $data.dependencyDashboardIssue
             then " · 📋 [Dependency Dashboard](https://github.com/\($repo)/issues/\($data.dependencyDashboardIssue))"
             else "" end) as $dashboard
          | "## 🔄 Renovate · `\($repo)`",
            "",
            "**\($merged | length)** merged · **\($prs)** PR open · **\($waiting)** waiting\($dashboard)",
            "",
            (if $result != "" and $result != "done" and $result != "automerged" then
               "> [!WARNING]", "> Renovate stopped early (`\($result)`), so this list is incomplete. Rerun the workflow.", ""
             else empty end),
            (if ($merged | length) > 0 then
               "### ✅ Merged this run", "",
               "| PR | Update |", "|---|---|",
               ($merged[] | "| [#\(.number)](\(.url)) | \(.title) |"),
               ""
             else empty end),
            (if ($open | length) > 0 then
               "### 📦 Open updates", "",
               "| Dependency | Change | Type | Status |", "|---|---|---|---|",
               ([$open[] | . as $b | (.upgrades // [])[] | {b: $b, u: .}] | sort_by(.u.depName)[]
                 | "| `\(.u.depName)` | `\(.u | old_version)` → `\(.u | new_version)` | \(.u.updateType) | \(.b | status)\(.b | pr) |"),
               ""
             else empty end),
            (if $hasReport != "yes" then
               "> [!WARNING]", "> Renovate wrote no report, check the **Run Renovate** step log."
             elif ($merged | length) == 0 and ($open | length) == 0 and ($result == "" or $result == "done") then
               "✨ Everything is up to date."
             else empty end)
          JQ

          jq -nr \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg hasReport "$has_report" \
            --arg result "$result" \
            --argjson merged "$merged" \
            --argjson data "$data" \
            -f "$RUNNER_TEMP/summary.jq" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain early stop
        if: always() && env.RUN_RESULT != '' && env.RUN_RESULT != 'done' && env.RUN_RESULT != 'automerged'
        env:
          LOG: /tmp/renovate-log.ndjson
        run: |
          # the info log only says renovate stopped, the debug records right before it say why
          grep -B 80 '"msg":"Repository finished"' "$LOG" \
            | jq -r '"\(.time) \(.msg)\(if .branch then " [\(.branch)]" else "" end)\(if .err then " | \(.err.message // .err | tostring)" else "" end)"' \
            || true

      - name: Send Telegram digest
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT: /tmp/renovate-report.json
        run: |
          # one message per run listing every open update, instead of one message per pr event
          [[ -s "$REPORT" ]] || { echo "no renovate report, nothing to send"; exit 0; }

          cat > "$RUNNER_TEMP/telegram.jq" <<'JQ'
          def esc: tostring | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def short: sub("^sha256:"; "") | .[0:7];
          def old_version: if .updateType == "digest" then (.currentDigest // "" | short) else (.currentVersion // .currentValue // "") end;
          def new_version: if .updateType == "digest" or .updateType == "pinDigest" then (.newDigest // "" | short) else (.newVersion // .newValue // "") end;
          def url: "https://github.com/\($repo)";

          (.repositories[$repo] // {})
          | .dependencyDashboardIssue as $dashboard
          | [(.branches // [])[] | select(.result != "automerged" and ((.upgrades // []) | length) > 0)]
          | sort_by(.branchName)
          | if length == 0 then empty else
              "<b>🔄 Renovate</b> · \($repo | split("/") | last | esc)",
              "<b>\(length)</b> app\(if length == 1 then "" else "s" end) with updates"
                + (if $dashboard then " · <a href=\"\(url)/issues/\($dashboard)\">dashboard</a>" else "" end),
              (.[]
                | (.branchName | sub("^renovate/"; "") | esc) as $app
                | (if .result == "pr-created" then "🆕" elif .prNo then "🔀" else "⏳" end) as $icon
                | (if .prNo then "<a href=\"\(url)/pull/\(.prNo)\"><b>\($app)</b></a>" else "<b>\($app)</b>" end) as $title
                | "",
                  "\($icon) \($title)",
                  (.upgrades[]
                    | "• \(.depName // "?" | split("/") | last | esc) <code>\(old_version | esc)</code> → <code>\(new_version | esc)</code>"
                      + (if .updateType == "major" then " ⚠️ major" else "" end)))
            end
          JQ

          text=$(jq -r --arg repo "$GITHUB_REPOSITORY" -f "$RUNNER_TEMP/telegram.jq" "$REPORT")
          if [[ -n "$RUN_RESULT" && "$RUN_RESULT" != "done" && "$RUN_RESULT" != "automerged" ]]; then
            text="⚠️ <b>Renovate stopped early</b> (${RUN_RESULT}), this list is incomplete. Rerun the workflow."$'\n\n'"${text}"
          fi
          [[ -n "$text" ]] || { echo "everything up to date, nothing to send"; exit 0; }

          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            -o "$RUNNER_TEMP/telegram.json" \
            -w "HTTP %{http_code}\n" \
            || { cat "$RUNNER_TEMP/telegram.json"; exit 1; }
